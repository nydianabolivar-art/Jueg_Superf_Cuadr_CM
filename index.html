:root{
  --bg:#060607; --ink:#ece3cf; --ink2:#b9ae98; --mute:#7d7566; --gold:#c9a24a; --gold2:#e6c873; --ox:#7a1518; --ember:#ff8a3a; --jade:#3fbf9f; --red:#b3262b; --st:#4f8f3a;

  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:var(--ink);font-family:var(--serif);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%!important;height:100%!important}
.hidden{display:none!important}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 85%,rgba(0,0,0,.85) 100%)}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1s steps(6) infinite}
@media (prefers-reduced-motion:reduce){#grain{animation:none}#title .press{animation:none}}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
#flash,#hurt,#fade{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash{background:#fff;mix-blend-mode:screen}
#hurt{background:radial-gradient(ellipse at center,rgba(120,0,0,0) 40%,rgba(150,10,10,.65) 100%)}
#fade{background:#000;transition:opacity .9s ease}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#bars{position:absolute;left:max(28px,env(safe-area-inset-left));top:26px;width:min(360px,46vw)}
.bar{position:relative;height:12px;margin-bottom:7px;background:rgba(10,8,8,.75);border:1px solid rgba(201,162,74,.55);box-shadow:0 0 0 1px rgba(0,0,0,.8)}
.bar i,.bar b{position:absolute;left:0;top:0;bottom:0}
.bar.hp i{background:linear-gradient(180deg,#c13a2e,#7c1810);z-index:2;transition:width .12s}
.bar.hp b{background:#e8c9a0;opacity:.6;transition:width .7s .35s;z-index:1}
.bar.st{height:8px;width:82%}
.bar.st i{background:linear-gradient(180deg,#6fae4a,#2f6a22);transition:width .08s}
.bar .lab{position:absolute;right:-2px;top:-15px;font:600 10px var(--cap);letter-spacing:.18em;color:var(--ink2)}
#flask,#souls{position:absolute;display:flex;align-items:center;gap:10px;font:600 18px var(--cap);color:var(--ink);text-shadow:0 2px 6px #000}
#flask{left:max(28px,env(safe-area-inset-left));bottom:30px}
#flask .ic,#souls .ic{width:46px;height:46px;border:1px solid rgba(201,162,74,.6);background:radial-gradient(circle,rgba(60,30,10,.8),rgba(5,5,5,.85));display:grid;place-items:center;transform:rotate(45deg)}
#flask .ic svg,#souls .ic svg{transform:rotate(-45deg);width:26px;height:26px}
#flask small{font:12px var(--serif);color:var(--ink2);display:block;letter-spacing:.06em}
#souls{right:max(28px,env(safe-area-inset-right));bottom:30px}
#souls .num{min-width:80px;text-align:right}
#lockmark{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid rgba(255,240,210,.9);border-radius:50%;box-shadow:0 0 12px rgba(255,200,120,.9);display:none}
#bossbar{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:min(780px,84vw);pointer-events:none}
#bossbar .name{font:600 17px var(--cap);letter-spacing:.14em;color:var(--ink);text-shadow:0 2px 8px #000;margin-bottom:5px}
#bossbar .track{position:relative;height:11px;background:rgba(8,6,6,.8);border:1px solid rgba(201,162,74,.6)}
#bossbar .track i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#b8331f,#6e140c);transition:width .25s}
#bossbar .track u{position:absolute;left:0;top:0;bottom:0;background:#f0d6a8;opacity:.55;transition:width .8s .4s}
#bossbar .segs{position:absolute;inset:0;display:flex}
#bossbar .segs span{flex:1;border-right:2px solid rgba(0,0,0,.85)}
#bossbar .segs span:last-child{border-right:0}
#bossbar .sub{display:flex;justify-content:space-between;margin-top:6px;font:13px var(--serif);color:var(--ink2);letter-spacing:.04em}
#bossbar .sub b{font:600 11px var(--cap);letter-spacing:.2em;color:var(--gold2)}
#bossbar .ward{height:4px;margin-top:4px;background:rgba(0,0,0,.6)}
#bossbar .ward i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#fff4d0);transition:width .15s;box-shadow:0 0 8px var(--accent)}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);padding:10px 26px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.82) 20%,rgba(0,0,0,.82) 80%,transparent);font:17px var(--serif);letter-spacing:.04em;white-space:nowrap;pointer-events:auto}
#prompt kbd{font:600 13px var(--cap);border:1px solid var(--gold);padding:1px 8px;margin-right:10px;color:var(--gold2)}
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:linear-gradient(180deg,transparent 38%,rgba(0,0,0,.72) 46%,rgba(0,0,0,.72) 58%,transparent 66%);animation:bannerIn 4.2s ease forwards}
#banner .t{font:400 clamp(34px,6.5vw,86px) var(--cap);letter-spacing:.12em;text-align:center}
#banner .s{font:italic 19px var(--serif);color:var(--ink2);text-align:center;margin-top:6px}
#banner.dead .t{color:#a3171b;text-shadow:0 0 30px rgba(160,20,20,.55);letter-spacing:.2em}
#banner.win .t{color:#f3d58e;text-shadow:0 0 28px rgba(240,190,90,.6)}
#banner.boss{background:none;align-items:end;padding-bottom:22vh}
#banner.boss .t{font-size:clamp(26px,4.4vw,56px);color:var(--ink)}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.04)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}
#zoneTitle{position:absolute;left:50%;top:24%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0}
#zoneTitle.on{animation:zoneIn 5s ease forwards}
#zoneTitle .z{font:400 clamp(26px,4vw,48px) var(--cap);letter-spacing:.22em;color:var(--ink)}
#zoneTitle .l{width:min(520px,70vw);height:1px;margin:10px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#zoneTitle .s{font:italic 17px var(--serif);color:var(--ink2);max-width:640px}
@keyframes zoneIn{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;top:13%;transform:translateX(-50%);font:16px var(--serif);color:var(--ink);background:rgba(0,0,0,.7);padding:8px 22px;border-top:1px solid rgba(201,162,74,.5);border-bottom:1px solid rgba(201,162,74,.5);opacity:0;transition:opacity .4s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1}
/* PANELES */
.panel{position:absolute;background:radial-gradient(ellipse at 50% 0%,rgba(46,34,22,.97),rgba(10,8,7,.97) 70%);border:1px solid rgba(201,162,74,.7);box-shadow:0 0 0 4px rgba(0,0,0,.85),0 0 0 5px rgba(201,162,74,.35),0 30px 80px rgba(0,0,0,.8);pointer-events:auto;color:var(--ink)}
.panel::before,.panel::after{content:'';position:absolute;width:22px;height:22px;border:2px solid var(--gold);pointer-events:none}
.panel::before{left:-7px;top:-7px;border-right:0;border-bottom:0}
.panel::after{right:-7px;bottom:-7px;border-left:0;border-top:0}
.ph{font:600 12px var(--cap);letter-spacing:.32em;color:var(--gold2);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.ph svg{width:18px;height:18px;flex:none}
.h2{font:400 26px var(--cap);letter-spacing:.06em;margin:4px 0 10px}
.btn{font:600 13px var(--cap);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:linear-gradient(180deg,rgba(80,58,30,.6),rgba(20,15,10,.8));border:1px solid var(--gold);padding:11px 22px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:10px}
.btn:hover,.btn:focus-visible{background:linear-gradient(180deg,rgba(150,110,50,.6),rgba(40,28,14,.9));color:#fff;outline:none;box-shadow:0 0 18px rgba(201,162,74,.35)}
.btn.ghost{border-color:rgba(201,162,74,.4);color:var(--ink2);background:transparent}
.btn svg{width:16px;height:16px}
#sello{right:max(3vw,16px);top:50%;transform:translateY(-50%);width:min(560px,92vw);padding:26px 30px 24px;max-height:92vh;overflow:auto}
#sello .q{font:20px/1.5 var(--serif);margin:12px 0 18px}
.eq{font:italic 23px var(--serif);white-space:nowrap;color:#fff6dc;padding:0 2px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.82em;line-height:1.1}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px 1px}
.fr>span:last-child{padding:1px 3px 0}
#sello .row{display:flex;gap:10px;align-items:stretch}
#sello input{flex:1;min-width:0;font:21px var(--serif);color:#fff;background:rgba(0,0,0,.45);border:0;border-bottom:2px solid var(--gold);padding:10px 12px;outline:none;user-select:text;-webkit-user-select:text}
#sello input::placeholder{color:#6f6656;font-style:italic;font-size:15px}
#sello .sym{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#sello .sym button{font:17px var(--serif);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid rgba(201,162,74,.35);padding:3px 11px;cursor:pointer}
#sello .msg{min-height:24px;margin-top:10px;font:italic 16px var(--serif);color:#f0c070}
#sello .res{margin-top:6px}
#sello .verdict{font:500 24px var(--cap);letter-spacing:.14em;margin-bottom:8px;display:flex;align-items:center;gap:12px}
#sello .verdict svg{width:30px;height:30px;flex:none}
#sello .verdict.ok{color:#f6d589}
#sello .verdict.ko{color:#e0574d}
#sello .diag{border-left:3px solid #e0574d;padding:8px 14px;background:rgba(120,20,20,.18);margin:10px 0;font:17px/1.45 var(--serif)}
#sello .diag b{font:600 11px var(--cap);letter-spacing:.2em;color:#ff9c8c;display:block;margin-bottom:3px}
#sello .expl{font:16.5px/1.55 var(--serif);color:var(--ink2);margin:8px 0 14px}
#sello .expl b{color:var(--ink)}
#sello .lvl{display:flex;gap:6px}
#sello .lvl i{width:22px;height:4px;background:rgba(201,162,74,.25)}
#sello .lvl i.on{background:var(--gold2);box-shadow:0 0 8px var(--gold)}
#lesson{right:max(2.5vw,12px);top:50%;transform:translateY(-50%);width:min(560px,94vw);max-height:90vh;overflow:auto;padding:24px 28px}
#lesson .body{font:17px/1.55 var(--serif);color:var(--ink)}
#lesson .body p{margin-bottom:10px}
#lesson ul{margin:8px 0 6px 18px}
#lesson li{margin-bottom:7px}
#lesson li::marker{color:var(--gold)}
.lx-eq{font:italic 24px var(--serif);text-align:center;margin:12px 0;color:#fff6dc;padding:10px;border-top:1px solid rgba(201,162,74,.3);border-bottom:1px solid rgba(201,162,74,.3)}
#lesson .holo{margin-top:12px;padding:12px 14px;background:rgba(0,0,0,.35);border:1px solid rgba(201,162,74,.25)}
#lesson .holo label{font:600 11px var(--cap);letter-spacing:.2em;color:var(--gold2)}
#lesson .holo input[type=range]{width:100%;accent-color:var(--gold);margin:8px 0}
#lesson .holo .out{font:17px var(--serif);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#lesson .holo .out b{color:#fff2c4}
#lesson .say{font:italic 17px/1.5 var(--serif);color:#cfe6ff;border-left:2px solid rgba(160,200,255,.5);padding-left:12px;margin:6px 0 14px}
#menu{left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,92vw);padding:26px 30px;max-height:90vh;overflow:auto}
#menu .opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
#menu .opts .btn{justify-content:flex-start}
#menu .ctrl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font:15px var(--serif);margin-top:12px}
#menu .ctrl kbd{font:600 11px var(--cap);letter-spacing:.08em;color:var(--gold2);border:1px solid rgba(201,162,74,.5);padding:2px 7px;white-space:nowrap;justify-self:start}
#menu .stat{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 14px;font:15px var(--serif);margin-top:10px}
#menu .stat .hd{font:600 10px var(--cap);letter-spacing:.18em;color:var(--gold2)}
#menu input[type=range]{width:100%;accent-color:var(--gold)}
/* PANTALLAS */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:auto;padding:24px}
#title{background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,0),rgba(0,0,0,.55) 70%,rgba(0,0,0,.9))}
#title .logo{font:400 clamp(40px,8.4vw,112px) var(--cap);letter-spacing:.16em;line-height:1;color:#efe4c8;text-shadow:0 0 40px rgba(255,170,80,.35),0 4px 20px #000}
#title .sub{font:italic clamp(17px,2.2vw,24px) var(--serif);color:var(--ink2);margin-top:10px;letter-spacing:.06em}
#title .rule{width:min(560px,70vw);height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#title .course{font:600 12px var(--cap);letter-spacing:.34em;color:var(--gold2)}
#title .opts{display:flex;flex-direction:column;gap:12px;margin-top:34px;min-width:min(320px,80vw)}
#title .opts .btn{justify-content:center}
#title .diff{display:flex;gap:8px;justify-content:center;margin-top:6px}
#title .diff button{font:600 11px var(--cap);letter-spacing:.18em;background:transparent;border:1px solid rgba(201,162,74,.35);color:var(--ink2);padding:7px 12px;cursor:pointer}
#title .diff button.on{border-color:var(--gold);color:#fff;background:rgba(201,162,74,.15)}
#title .diffNote{font:italic 14px var(--serif);color:var(--mute);margin-top:6px;min-height:20px}
#title .credit{position:absolute;bottom:22px;left:0;right:0;font:14px var(--serif);color:var(--mute);letter-spacing:.08em}
#title .press{margin-top:28px;font:600 12px var(--cap);letter-spacing:.4em;color:var(--ink2);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
#story{background:rgba(0,0,0,.82)}
#story .line{font:clamp(19px,2.4vw,28px)/1.6 var(--serif);max-width:820px;opacity:0;transition:opacity 1.2s}
#story .line.on{opacity:1}
#story .skip{position:absolute;bottom:26px;right:30px}
#summary{background:radial-gradient(ellipse at 50% 30%,rgba(40,28,14,.92),rgba(0,0,0,.97));overflow:auto;justify-content:flex-start;padding-top:6vh}
#summary .card{width:min(860px,94vw);text-align:left}
#summary table{width:100%;border-collapse:collapse;margin:14px 0;font:16px var(--serif)}
#summary th{font:600 11px var(--cap);letter-spacing:.18em;color:var(--gold2);text-align:left;border-bottom:1px solid rgba(201,162,74,.4);padding:6px 8px}
#summary td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
#summary .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
#summary .kpi div{border:1px solid rgba(201,162,74,.35);padding:12px;text-align:center}
#summary .kpi b{display:block;font:400 30px var(--cap);color:#f3d58e}
#summary .kpi span{font:600 10px var(--cap);letter-spacing:.2em;color:var(--ink2)}
#summary .mis li{margin:6px 0 6px 18px;font:15.5px/1.45 var(--serif);color:var(--ink2)}
#loading{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font:600 12px var(--cap);letter-spacing:.4em;color:var(--ink2);z-index:50}
#loading .ring{width:56px;height:56px;border:1px solid rgba(201,162,74,.3);border-top-color:var(--gold);border-radius:50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LLAMAS, TROFEO, SUBTÍTULOS */
#llamas{position:absolute;right:max(30px,env(safe-area-inset-right));bottom:96px;display:flex;gap:9px;pointer-events:auto}
#llamas .ll{width:24px;height:24px;padding:0;transform:rotate(45deg);border:1px solid rgba(201,162,74,.35);background:rgba(5,5,5,.6);display:grid;place-items:center;color:#5a5346;cursor:pointer;transition:transform .15s,border-color .15s}
#llamas .ll:hover,#llamas .ll:focus-visible{transform:rotate(45deg) scale(1.18);border-color:var(--gold2);outline:none}
#llamas .ll svg{width:16px;height:16px;transform:rotate(-45deg)}
#llamas .ll.on{border-color:var(--c);color:var(--c);box-shadow:0 0 10px var(--c),inset 0 0 8px rgba(0,0,0,.6);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(5,5,5,.7))}
#award{position:absolute;left:50%;bottom:20%;transform:translate(-50%,24px);opacity:0;transition:opacity .6s,transform .6s;display:flex;gap:18px;align-items:center;padding:16px 26px 16px 20px;min-width:min(440px,90vw);background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(8,6,4,.88) 14%,rgba(8,6,4,.88) 86%,rgba(0,0,0,.2));border-top:1px solid var(--c);border-bottom:1px solid var(--c);pointer-events:none}
#award.on{opacity:1;transform:translate(-50%,0)}
#award .gem{width:58px;height:58px;flex:none;transform:rotate(45deg);border:1px solid var(--c);display:grid;place-items:center;color:var(--c);box-shadow:0 0 22px var(--c);background:radial-gradient(circle,rgba(255,255,255,.12),rgba(0,0,0,.6))}
#award .gem svg{width:34px;height:34px;transform:rotate(-45deg)}
#award .lab{font:600 11px var(--cap);letter-spacing:.24em;color:var(--c)}
#award .nm{font:400 25px var(--cap);letter-spacing:.06em;margin:2px 0}
#award .ls{font:italic 16px var(--serif);color:var(--ink2);max-width:420px}
#subs{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(900px,90vw);text-align:center;opacity:0;transition:opacity .9s;pointer-events:none}
#subs.on{opacity:1}
#subs b{display:block;font:600 11px var(--cap);letter-spacing:.3em;color:var(--gold2);margin-bottom:6px}
#subs span{font:italic clamp(18px,2.2vw,25px)/1.45 var(--serif);color:#fff6e2;text-shadow:0 2px 12px #000,0 0 2px #000}
#skipBtn{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));z-index:6}
.linkish{background:none;border:0;color:var(--ink2);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.linkish:hover,.linkish:focus-visible{color:var(--gold2);outline:none}
/* RELICARIO */
#menu.wide{width:min(600px,94vw)}
.rel{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rel-i{display:flex;gap:14px;align-items:flex-start;padding:10px 12px;border:1px solid rgba(201,162,74,.22);background:rgba(0,0,0,.25)}
.rel-i.sel{border-color:var(--c);box-shadow:0 0 14px rgba(0,0,0,.6),inset 0 0 0 1px var(--c)}
.rel-g{width:34px;height:34px;flex:none;transform:rotate(45deg);border:1px solid rgba(201,162,74,.35);display:grid;place-items:center;color:#5a5346;margin:4px 6px 0 4px}
.rel-g svg{width:20px;height:20px;transform:rotate(-45deg)}
.rel-i.on .rel-g{border-color:var(--c);color:var(--c);box-shadow:0 0 10px var(--c)}
.rel-t{min-width:0}
.rel-t b{display:block;font:600 14px var(--cap);letter-spacing:.06em;color:var(--ink)}
.rel-i:not(.on) .rel-t b{color:var(--mute)}
.rel-t small{display:block;font:600 9.5px var(--cap);letter-spacing:.18em;color:var(--gold2);margin:2px 0 3px}
.rel-i:not(.on) .rel-t small{color:var(--mute)}
.rel-t p{font:15px/1.45 var(--serif);color:var(--ink2)}
.rel-foot{font:italic 15px var(--serif);color:var(--ink2);margin-top:10px}
/* RECOMPENSAS */
#rewards{background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.25),rgba(0,0,0,.82) 75%);overflow:auto;justify-content:flex-start;padding-top:5vh}
.rw{width:min(940px,94vw);text-align:center}
.rw-h{font:400 clamp(26px,4vw,46px) var(--cap);letter-spacing:.06em;color:#f6dfa6;text-shadow:0 0 30px rgba(255,190,90,.45);margin:6px 0 10px;text-wrap:balance}
.rw-crown{display:flex;gap:14px;justify-content:center;margin-bottom:14px}
.rw-crown svg{width:30px;height:30px;filter:drop-shadow(0 0 8px currentColor)}
.rw-grade{display:flex;flex-direction:column;gap:4px;align-items:center;margin-bottom:20px}
.rw-grade span{font:600 11px var(--cap);letter-spacing:.3em;color:var(--gold2)}
.rw-grade b{font:400 clamp(26px,3.6vw,40px) var(--cap);color:#fff}
.rw-grade em{font:italic 15px var(--serif);color:var(--ink2)}
.rw-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left}
.rw-card{display:flex;gap:14px;padding:16px 18px;border:1px solid rgba(201,162,74,.4);background:linear-gradient(180deg,rgba(40,30,18,.85),rgba(10,8,6,.85))}
.rw-card .ic{width:38px;height:38px;flex:none;color:var(--gold2);display:grid;place-items:center;border:1px solid rgba(201,162,74,.5);transform:rotate(45deg)}
.rw-card .ic svg{width:20px;height:20px;transform:rotate(-45deg)}
.rw-card .t{font:600 15px var(--cap);letter-spacing:.06em;color:var(--ink);margin-bottom:4px}
.rw-card p{font:15.5px/1.45 var(--serif);color:var(--ink2)}
.rw-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px 0 10px}
.rw-credit{font:14px var(--serif);color:var(--mute);padding-bottom:22px}
/* FORJA */
#forja{right:max(2vw,12px);top:50%;transform:translateY(-50%);width:min(520px,94vw);max-height:94vh;overflow:auto;padding:20px 24px}
.f-eq{font-size:15px;margin:10px 0 2px;min-height:30px}
.f-eq .eq{font-size:21px;white-space:normal}
.f-name{font:400 25px var(--cap);letter-spacing:.05em;color:#f6dfa6;margin:4px 0}
.f-name.dg{color:#e8a08f}
.f-can{font:15px var(--serif);color:var(--ink2);margin-bottom:4px}
.f-can .eq{font-size:18px;white-space:normal}
.f-info{font:15px/1.45 var(--serif);color:var(--ink);min-height:22px}
.f-sub{font:600 10px var(--cap);letter-spacing:.24em;color:var(--gold2);margin:14px 0 6px}
.f-sub i{font:italic 13px var(--serif);letter-spacing:0;color:var(--ink2);text-transform:none}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.fs{display:grid;grid-template-columns:18px 1fr 44px;gap:8px;align-items:center;font:italic 16px var(--serif)}
.fs input,.f-plane input{accent-color:var(--gold);width:100%;min-width:0}
.fs output,.f-plane output{font:15px var(--serif);text-align:right;font-variant-numeric:tabular-nums;color:#fff2c4}
.f-plane{display:grid;grid-template-columns:auto 1fr 44px;gap:10px;align-items:center}
.f-plane select,.tin{font:16px var(--serif);color:var(--ink);background:rgba(0,0,0,.5);border:1px solid rgba(201,162,74,.5);padding:6px 8px}
.f-trace{font:16px var(--serif);margin-top:6px}
.f-trace b{color:#fff2c4;font-weight:500}
.f-pre{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:13px var(--serif);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid rgba(201,162,74,.35);padding:4px 10px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--gold);color:#fff;outline:none}
/* CERTIFICADO */
#cert{background:radial-gradient(ellipse at 50% 30%,rgba(30,22,12,.9),rgba(0,0,0,.95));overflow:auto;justify-content:flex-start;padding-top:4vh}
#cert .panel.cf{position:relative;width:min(520px,94vw);padding:26px 28px;text-align:left}
.tin{width:100%;user-select:text;-webkit-user-select:text}
#cert .msg{min-height:22px;margin-top:8px;font:italic 15px var(--serif);color:#f0c070}
.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vf{display:flex;flex-direction:column;gap:4px;font:600 10px var(--cap);letter-spacing:.14em;color:var(--gold2);margin-top:8px}
.vres{margin-top:12px;font:17px var(--serif)}
.vres.ok{color:#9be3a1}.vres.ko{color:#ef8a7c}
.certcard{width:min(780px,94vw);padding:34px clamp(18px,5vw,56px);text-align:center;background:radial-gradient(ellipse at 50% 0%,#2c2214,#120e09 70%);border:1px solid var(--gold);box-shadow:0 0 0 6px #0b0805,0 0 0 7px rgba(201,162,74,.45),0 30px 80px #000;position:relative}
.cc-top{display:flex;gap:12px;justify-content:center;margin-bottom:12px}
.cc-top svg{width:26px;height:26px;filter:drop-shadow(0 0 6px currentColor)}
.cc-k{font:600 13px var(--cap);letter-spacing:.42em;color:var(--gold2)}
.cc-g{font:italic 16px var(--serif);color:var(--ink2);margin-top:4px}
.cc-s{font:italic 18px var(--serif);color:var(--ink2);margin-top:22px}
.cc-n{font:400 clamp(28px,5vw,48px) var(--cap);color:#fff3d6;letter-spacing:.05em;margin:6px 0 10px;border-bottom:1px solid rgba(201,162,74,.5);padding-bottom:10px;overflow-wrap:anywhere}
.cc-t{font:17px/1.55 var(--serif);color:var(--ink);max-width:620px;margin:0 auto}
.cc-grade{font:600 13px var(--cap);letter-spacing:.2em;color:var(--gold2);margin:18px 0 12px}
.cc-grade b{display:block;font:400 30px var(--cap);letter-spacing:.06em;color:#f6dfa6;margin-top:4px}
.cc-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0 16px}
.cc-row div{border:1px solid rgba(201,162,74,.3);padding:8px 4px}
.cc-row b{display:block;font:400 21px var(--cap);color:#fff2c4;font-variant-numeric:tabular-nums}
.cc-row span{font:600 9px var(--cap);letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
.cc-code{font:15px var(--serif);color:var(--ink2)}
.cc-code b{font:600 18px var(--cap);letter-spacing:.16em;color:#fff;margin-left:8px;user-select:text;-webkit-user-select:text}
.cc-credit{font:14px var(--serif);color:var(--mute);margin-top:16px}

#app.touch #llamas{bottom:auto;top:62px;right:max(70px,env(safe-area-inset-right));transform:scale(.8);transform-origin:right top}
@media (max-height:520px){#forja{top:8px;bottom:8px;transform:none;max-height:none;width:min(500px,62vw)}}
/* TÁCTIL */
#touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;left:max(26px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;border:1px solid rgba(201,162,74,.45);background:radial-gradient(circle,rgba(0,0,0,.15),rgba(0,0,0,.45));pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:radial-gradient(circle,rgba(230,200,115,.55),rgba(120,90,40,.35));border:1px solid var(--gold)}
#tbtns{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:230px;height:230px;pointer-events:none}
#tbtns button{position:absolute;width:62px;height:62px;border-radius:50%;border:1px solid rgba(201,162,74,.6);background:rgba(10,8,6,.55);color:var(--ink);font:600 9px var(--cap);letter-spacing:.08em;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#tbtns button svg{width:22px;height:22px}
#tbtns button:active,#tbtns button.on{background:rgba(201,162,74,.35)}
#tbtns .b-atk{right:70px;bottom:6px;width:76px;height:76px}
#tbtns .b-hvy{right:0;bottom:70px}
#tbtns .b-roll{right:150px;bottom:0}
#tbtns .b-blk{right:84px;bottom:92px}
#tbtns .b-lock{right:0;bottom:150px;width:52px;height:52px}
#tbtns .b-flask{right:156px;bottom:72px;width:52px;height:52px}
#tbtns .b-use{right:62px;bottom:168px;width:52px;height:52px}
#tpause{position:absolute;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));width:44px;height:44px;border:1px solid rgba(201,162,74,.5);background:rgba(0,0,0,.5);color:var(--ink);font:600 16px var(--cap);pointer-events:auto}
#app.touch #flask{left:max(18px,env(safe-area-inset-left));top:62px;bottom:auto;transform:scale(.72);transform-origin:left top}
#app.touch #souls{right:max(70px,env(safe-area-inset-right));top:14px;bottom:auto;transform:scale(.72);transform-origin:right top}
#app.touch #bossbar{bottom:12px;width:min(44vw,420px)}
#app.touch #bossbar .name{font-size:13px}
#app.touch #bossbar .sub{font-size:11px}
#app.touch #bars{width:min(300px,34vw);top:16px;left:max(18px,env(safe-area-inset-left))}
#app.touch #prompt{bottom:auto;top:30%}
@media (max-height:520px){
  #title .logo{font-size:clamp(30px,7vh,56px)}
  #title .sub{font-size:15px;margin-top:4px}
  #title .rule{margin:10px auto}
  #title .opts{margin-top:14px;gap:8px}
  #title .opts .btn{padding:8px 18px}
  #title .credit{bottom:8px;font-size:12px}
  #title .diffNote{display:none}
  #sello{top:8px;bottom:8px;transform:none;max-height:none;padding:16px 20px;width:min(560px,66vw)}
  #sello .q{font-size:16px;margin:6px 0 10px}
  .eq{font-size:18px}
  #lesson{top:8px;bottom:8px;transform:none;max-height:none;width:min(520px,64vw);padding:14px 18px}
  #lesson .body{font-size:15px}
  .lx-eq{font-size:19px;margin:8px 0;padding:6px}
  #banner .t{font-size:clamp(28px,9vh,60px)}
  #zoneTitle{top:12%}
}
@media (max-width:760px){
  #sello{right:0;left:0;top:auto;bottom:0;transform:none;width:100%;max-height:62vh;padding:18px 18px 16px}
  #sello .q{font-size:17px;margin:8px 0 12px}
  .eq{font-size:19px;white-space:normal}
  #lesson{right:0;left:0;top:auto;bottom:0;transform:none;width:100%;max-height:58vh;padding:16px 18px}
  #bossbar{bottom:auto;top:96px}
  #bars{width:52vw}
  #flask{bottom:auto;top:84px;transform:scale(.8);transform-origin:left top}
  #souls{bottom:auto;top:26px;transform:scale(.8);transform-origin:right top}
  #prompt{bottom:38%}
}
